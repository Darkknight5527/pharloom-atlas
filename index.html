<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pharloom Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Map Genie map fills the screen; a collapsible tracker panel sits on the right (bottom drawer on phones). Single dark look by choice. */
:root {
  color-scheme: dark;
  --ink: #0b0d12;
  --panel: #12151d;
  --panel-2: #191d28;
  --line: #2a3040;
  --bone: #e6dfcf;
  --bone-dim: #a39d90;
  --bone-faint: #6f6b63;
  --needle: #c8473f;
  --font-display: "Marcellus SC", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--bone); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid #d6a84a; outline-offset: 2px; }

.app { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
.app.closed { grid-template-columns: 1fr 0; }
.map { position: relative; min-width: 0; display: flex; flex-direction: column; }
.map iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--ink); }
.credit { padding: 6px 12px; font-size: 11.5px; color: var(--bone-faint); border-top: 1px solid var(--line); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.credit a { color: var(--bone-dim); }
.open-panel { position: absolute; right: 12px; top: 12px; z-index: 3; }

.side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.head-top { display: flex; align-items: center; gap: 8px; }
.head h1 { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .06em; margin: 0; }
.head-top .chip-btn { margin-left: auto; }
.prog-row { display: flex; justify-content: space-between; align-items: baseline; }
.prog-row strong { font-family: var(--font-display); font-weight: 400; font-size: 20px; font-variant-numeric: tabular-nums; }
.prog-row span { color: var(--bone-dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--needle); transition: width .3s; }
.tools { display: flex; gap: 6px; }
.tools input, .tools select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; }
.tools input { flex: 1; }
.tools input::placeholder { color: var(--bone-faint); }

.list { overflow-y: auto; padding: 8px 10px 16px; flex: 1; min-height: 0; }
.group > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 8px 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--bone-faint); }
.group > summary::-webkit-details-marker { display: none; }
.group > summary .n { margin-left: auto; font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 7px 8px; border-radius: 6px; }
.item:hover { background: var(--panel-2); }
.item input[type=checkbox] { width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--needle); cursor: pointer; }
.item label { cursor: pointer; min-width: 0; }
.item .nm { display: block; line-height: 1.35; }
.item .sub { display: block; color: var(--bone-faint); font-size: 12px; margin-top: 1px; overflow-wrap: anywhere; }
.item.done .nm { color: var(--bone-faint); text-decoration: line-through; }
.del { background: none; border: 0; color: var(--bone-faint); cursor: pointer; font-size: 16px; padding: 0 4px; }
.del:hover { color: var(--needle); }
.empty { color: var(--bone-faint); font-size: 12.5px; padding: 12px 8px; }

.foot { border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.form { display: grid; gap: 6px; }
.form .row { display: flex; gap: 6px; }
.form input, .form select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
.err { color: #f08d85; font-size: 12px; }
.btn { background: var(--needle); color: #fff4ef; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { filter: brightness(1.1); }
.chip-btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--bone-dim); }
.chip-btn:hover { color: var(--bone); border-color: var(--bone-faint); }
.backup { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.note { color: var(--bone-faint); font-size: 11.5px; line-height: 1.45; margin: 0; }
.confirm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

@media (max-width: 760px) {
  .app, .app.closed { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .side { border-left: 0; border-top: 1px solid var(--line); max-height: 55vh; }
  .app.closed .side .list, .app.closed .side .foot, .app.closed .side .tools { display: none; }
  .app.closed .side { max-height: none; }
  .open-panel { display: none; }
}
@media (min-width: 761px) { .app.closed .side { display: none; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <main class="map">
    <iframe src="https://mapgenie.io/hollow-knight-silksong/maps/pharloom?embed=light" title="Map Genie interactive map of Pharloom" allowfullscreen></iframe>
    <div class="credit">
      <span>Interactive map by <a href="https://mapgenie.io/hollow-knight-silksong/maps/pharloom" target="_blank" rel="noopener">Map Genie</a></span>
      <a href="https://mapgenie.io/hollow-knight-silksong/maps/pharloom" target="_blank" rel="noopener">Open full site ↗</a>
    </div>
    <button class="chip-btn open-panel" id="openPanel" hidden>Show tracker</button>
  </main>

  <aside class="side" id="side" aria-label="Progress tracker">
    <div class="head">
      <div class="head-top">
        <h1>My tracker</h1>
        <button class="chip-btn" id="togglePanel" aria-expanded="true">Hide</button>
      </div>
      <div class="prog-row"><strong id="doneNum">0</strong><span id="doneOf">of 0 done</span></div>
      <div class="bar"><i id="doneBar"></i></div>
      <div class="tools">
        <input id="q" type="search" placeholder="Search your list…" autocomplete="off">
        <select id="show" aria-label="Show">
          <option value="all">All</option>
          <option value="todo">To do</option>
          <option value="done">Done</option>
        </select>
      </div>
    </div>

    <div class="list" id="list"></div>

    <div class="foot">
      <form class="form" id="addForm" novalidate>
        <div class="row">
          <input id="newName" placeholder="Add item, e.g. Mask shard near bench" maxlength="80">
          <button class="btn" type="submit">Add</button>
        </div>
        <div class="row">
          <select id="newCat" aria-label="Category"></select>
          <input id="newArea" placeholder="Area (optional)" maxlength="40">
        </div>
        <span class="err" id="addErr" hidden>Type a name for the item first.</span>
      </form>
      <div class="backup">
        <button class="chip-btn" id="exportBtn" type="button">Back up</button>
        <label class="chip-btn" for="importFile">Restore</label>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <button class="chip-btn" id="resetBtn" type="button">Reset ticks</button>
      </div>
      <div class="confirm" id="resetConfirm" hidden>
        <span class="err">Untick everything?</span>
        <button class="btn" id="resetYes" type="button">Untick all</button>
        <button class="chip-btn" id="resetNo" type="button">Cancel</button>
      </div>
      <p class="note" id="status">Saved in this browser. Use Back up to move your progress to another device.</p>
    </div>
  </aside>
</div>

<script>
(() => {
const CATS = [
  { id: "boss", name: "Bosses", color: "#c8473f" },
  { id: "ability", name: "Abilities", color: "#a07bd0" },
  { id: "bellway", name: "Bellway stations", color: "#d6a84a" },
  { id: "npc", name: "NPCs & vendors", color: "#6f93b8" },
  { id: "mask", name: "Mask shards", color: "#e07a6a" },
  { id: "spool", name: "Spool fragments", color: "#d78fb0" },
  { id: "flea", name: "Fleas", color: "#8fb37a" },
  { id: "other", name: "My notes", color: "#cfc6b4" }
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));

// Starter list (names and areas only)
const SEED = [
  ["b1","boss","Moss Mother","Moss Grotto"],["b2","boss","Bell Beast","The Marrow"],["b3","boss","Lace","Deep Docks"],
  ["b4","boss","Fourth Chorus","Far Fields"],["b5","boss","Moorwing","Greymoor"],["b6","boss","Widow","Bellhart"],
  ["b7","boss","Sister Splinter","Shellwood"],["b8","boss","Last Judge","Grand Gate"],["b9","boss","Skarrsinger Karmelita","Hunter's March"],
  ["b10","boss","Phantom","Exhaust Organ"],["b11","boss","Groal the Great","Bilewater"],["b12","boss","Grand Mother Silk","The Cradle"],
  ["a1","ability","Silkspear","The Marrow"],["a2","ability","Swift Step","Deep Docks"],["a3","ability","Drifter's Cloak","Far Fields"],
  ["a4","ability","Needolin","Bellhart"],["a5","ability","Thread Storm","Greymoor"],
  ["w1","bellway","Bone Bottom","Bone Bottom"],["w2","bellway","The Marrow","The Marrow"],["w3","bellway","Deep Docks","Deep Docks"],
  ["w4","bellway","Far Fields","Far Fields"],["w5","bellway","Greymoor","Greymoor"],["w6","bellway","Bellhart","Bellhart"],
  ["w7","bellway","Shellwood","Shellwood"],["w8","bellway","Blasted Steps","Blasted Steps"],["w9","bellway","Grand Bellway","The Citadel"],
  ["n1","npc","Shakra (maps)","The Marrow"],["n2","npc","Fleamaster Mooshka","The Marrow"],["n3","npc","Pebb (shop)","Bone Bottom"],
  ["n4","npc","Forge Daughter (tools)","Deep Docks"],["n5","npc","Creige (Halfway Home)","Greymoor"],["n6","npc","Nuu (Hunter's Journal)","Greymoor"]
].map(([id,cat,name,area]) => ({ id, cat, name, area, user: false }));

const KEY = "pharloom-tracker:v1";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { setStatus("Couldn't save. Your browser may be blocking storage for this site."); } }
const saved = load();
const state = { done: saved.done || [], user: saved.user || [], open: saved.open || {}, panel: saved.panel !== false };
let done = new Set(state.done);
const items = () => SEED.concat(state.user);

const listEl = document.getElementById("list"), q = document.getElementById("q"), show = document.getElementById("show");
function setStatus(t) { document.getElementById("status").textContent = t; }

function render() {
  const s = q.value.trim().toLowerCase(), mode = show.value;
  listEl.innerHTML = "";
  let shown = 0;
  CATS.forEach(c => {
    const all = items().filter(i => i.cat === c.id);
    const vis = all.filter(i => (!s || (i.name + " " + (i.area || "")).toLowerCase().includes(s))
      && (mode === "all" || (mode === "done") === done.has(i.id)));
    if (!vis.length && (s || mode !== "all" || !all.length)) return;
    const det = document.createElement("details");
    det.className = "group"; det.open = state.open[c.id] !== false || !!s;
    det.addEventListener("toggle", () => { if (!s) { state.open[c.id] = det.open; save(); } });
    const n = all.filter(i => done.has(i.id)).length;
    det.innerHTML = `<summary><span class="dot" style="background:${c.color}"></span><span></span><span class="n">${n}/${all.length}</span></summary>`;
    det.querySelector("summary span:nth-child(2)").textContent = c.name;
    vis.forEach(i => {
      shown++;
      const row = document.createElement("div");
      row.className = "item" + (done.has(i.id) ? " done" : "");
      const cid = "chk-" + i.id;
      row.innerHTML = `<input type="checkbox" id="${cid}" ${done.has(i.id) ? "checked" : ""}><label for="${cid}"><span class="nm"></span><span class="sub"></span></label>`;
      row.querySelector(".nm").textContent = i.name;
      row.querySelector(".sub").textContent = i.area || "";
      row.querySelector("input").addEventListener("change", e => {
        e.target.checked ? done.add(i.id) : done.delete(i.id);
        state.done = [...done]; save(); render();
      });
      if (i.user) {
        const del = document.createElement("button");
        del.className = "del"; del.type = "button"; del.setAttribute("aria-label", "Delete " + i.name); del.textContent = "×";
        del.onclick = () => { state.user = state.user.filter(u => u.id !== i.id); done.delete(i.id); state.done = [...done]; save(); render(); };
        row.appendChild(del);
      }
      det.appendChild(row);
    });
    listEl.appendChild(det);
  });
  if (!shown) listEl.innerHTML = `<p class="empty">${s ? "Nothing matches that search." : mode === "done" ? "Nothing ticked yet." : "All done here."}</p>`;
  const total = items().length, d = items().filter(i => done.has(i.id)).length;
  document.getElementById("doneNum").textContent = d;
  document.getElementById("doneOf").textContent = `of ${total} done`;
  document.getElementById("doneBar").style.width = total ? (d / total * 100) + "%" : "0";
}
q.addEventListener("input", render); show.addEventListener("change", render);

// Add items
const newCat = document.getElementById("newCat");
CATS.forEach(c => { const o = document.createElement("option"); o.value = c.id; o.textContent = c.name; if (c.id === "other") o.selected = true; newCat.appendChild(o); });
const newName = document.getElementById("newName"), addErr = document.getElementById("addErr");
newName.addEventListener("input", () => addErr.hidden = true);
document.getElementById("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = newName.value.trim();
  if (!name) { addErr.hidden = false; newName.focus(); return; }
  const area = document.getElementById("newArea").value.trim();
  state.user.push({ id: "u" + Date.now().toString(36), cat: newCat.value, name, area, user: true });
  state.open[newCat.value] = true;
  save(); newName.value = ""; document.getElementById("newArea").value = ""; q.value = ""; show.value = "all"; render();
  setStatus(`Added "${name}".`);
});

// Backup / restore
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({ done: [...done], user: state.user }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "pharloom-progress.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  setStatus("Backup saved as pharloom-progress.json.");
};
document.getElementById("importFile").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.done) || !Array.isArray(d.user)) throw 0;
      done = new Set(d.done); state.done = d.done; state.user = d.user; save(); render();
      setStatus("Progress restored from backup.");
    } catch { setStatus("That file isn't a Pharloom Atlas backup. Pick the pharloom-progress.json file you saved."); }
    e.target.value = "";
  };
  r.readAsText(f);
});
const resetConfirm = document.getElementById("resetConfirm");
document.getElementById("resetBtn").onclick = () => resetConfirm.hidden = false;
document.getElementById("resetNo").onclick = () => resetConfirm.hidden = true;
document.getElementById("resetYes").onclick = () => { done.clear(); state.done = []; save(); render(); resetConfirm.hidden = true; setStatus("All items unticked."); };

// Panel toggle
const app = document.getElementById("app"), toggleBtn = document.getElementById("togglePanel"), openBtn = document.getElementById("openPanel");
function setPanel(open) {
  app.classList.toggle("closed", !open);
  toggleBtn.textContent = open ? "Hide" : "Show";
  toggleBtn.setAttribute("aria-expanded", String(open));
  openBtn.hidden = open;
  state.panel = open; save();
}
toggleBtn.onclick = () => setPanel(app.classList.contains("closed"));
openBtn.onclick = () => setPanel(true);
setPanel(state.panel);

render();
})();
</script>
</body>
</html>
